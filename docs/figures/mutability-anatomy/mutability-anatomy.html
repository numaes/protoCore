<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mutability anatomy</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>
.mp-plate:not([data-on]){display:none}
.mp-stock:not([data-on]){display:none}
.mp-mark{opacity:0;transition:opacity .25s var(--anatomy-ease)}
.mp-plate[data-mark] .mp-mark{opacity:1}
.mp-plate[data-state="old"] .iso-edge{stroke:var(--anatomy-lo)}
.mp-plate[data-state="old"] .iso-top{fill:var(--anatomy-shade-1)}
.mp-plate[data-state="held"] .iso-edge{stroke:var(--anatomy-mid)}
.mp-plate[data-state="new"] .iso-edge{stroke:var(--anatomy-lit)}
.mp-plate[data-state="new"] .iso-top{fill:var(--anatomy-lit-top)}
.mp-void{fill:var(--anatomy-shade-0)}
[data-part="sweep-lamp"]{opacity:0;transition:opacity .3s var(--anatomy-ease)}
[data-part="collector"][data-on] [data-part="sweep-lamp"]{opacity:1}
.mp-scan{fill:var(--anatomy-lit);opacity:0}
.iso-stage{touch-action:pan-y;cursor:pointer}
.iso-stage:focus{outline:none}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.mp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

Every value is built from immutable 64-byte cells (one cache line each), drawn here as type plates; a mutable object's state is one version of such a tree. A write never touches a plate: it casts new plates for the path from the changed field to the root and shares every other plate with the previous version, then publishes by a compare-and-swap on the object's entry in a table of 256 shards, the pigeonholes (the open case shows shards 0-31). Each shard root is an immutable sparse list, so a single write copies roughly ten cells in all, the object's path and the shard's path; setAttributes publishes a run of changes as one version (five fields of a new object: 16 cells instead of 52). If another writer published first, the latch refuses and the writer re-applies its change on the newer version. Readers take whatever version the token names and read it with no lock, because it never changes under them. The collector pauses every thread only to capture their roots and the 256 shard roots (at most 0.23 ms per cycle measured), then marks with no write barrier, walking immutable cells while threads keep running, and the sweep returns unreachable cells to free stock: the memory stays with the process, not with the OS.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

// The truth that drives the figure: a pure model of one mutable object in protoCore.
//
// A version of the object's state is an immutable tree of cells (the "page"), drawn as
// plates on a composing stone. A write never touches a plate: it casts new plates for the
// path from the changed leaf up to the root (path copy) and shares every other plate with
// the previous version. The current version is named by one token in one pigeonhole of the
// type case (the mutable-shard table), and a write publishes by compare-and-swap on it.
// The collector frees the plates that no root reaches.
//
// This file is imported by build.mjs and inlined (exports stripped) into the page.

// Numbers from protoCore (docs/GarbageCollector.md, docs/MemoryModel.md, CHANGELOG 2.11.0).
const TRUTH = {
  cellBytes: 64, // one Cell is one 64-byte cache line
  shards: 256, // MUTABLE_ROOT_SHARDS
  snapshotBytes: 2048, // 256 shard-root pointers captured at the pause
  pauseMaxMs: 0.23, // measured stop-the-world window per cycle (2026-10-03)
  fieldByField: 52, // a fresh 5-field mutable object written field by field, in cells
  oneGroup: 16, // the same five fields published with one setAttributes, in cells
};

// The figure's page: a balanced binary tree of 15 plates, 4 levels deep.
const LEVELS = 4;
const NODES = 15;
const LEAVES = 8;
const SITES = 4; // seats on the stone for each node of the tree
const CASE_COLS = 4;
const CASE_ROWS = 8; // 32 pigeonholes visible: shards 0-31
const DRAWERS = 7; // seven closed cases below hold shards 32-255

const levelOf = (n) => Math.floor(Math.log2(n + 1));
const parentOf = (n) => (n - 1) >> 1;
const kidsOf = (n) => (n < 7 ? [2 * n + 1, 2 * n + 2] : null);
const leafNode = (j) => 7 + j;
const nodeOfSite = (s) => Math.floor(s / SITES);

function createWorld(free) {
  return { plates: {}, token: -1, version: 0, history: [], free, born: 0, reserved: {} };
}

function siteOfNode(world, root, node) {
  const chain = [];
  for (let n = node; n > 0; n = parentOf(n)) chain.push(n);
  let s = root;
  for (let i = chain.length - 1; i >= 0; i--) s = world.plates[s].kids[(chain[i] - 1) % 2];
  return s;
}

// The nodes a change to these leaves must copy, deepest first (a path copy is built bottom up).
function pathNodes(leaves) {
  const nodes = new Set();
  for (const j of leaves) for (let n = leafNode(j); ; n = parentOf(n)) {
    nodes.add(n);
    if (n === 0) break;
  }
  return [...nodes].sort((a, b) => b - a);
}

// Plan a new version on top of `base`: one new plate per node on the changed paths, every
// other child shared with `base`. Returns null when a node has no free seat (the writer waits).
function compose(world, base, leaves) {
  const nodes = pathNodes(leaves);
  const fresh = {};
  for (const n of nodes) {
    let pick = -1;
    for (let k = 0; k < SITES; k++) {
      const s = n * SITES + k;
      if (!world.plates[s] && !world.reserved[s]) { pick = s; break; }
    }
    if (pick < 0) return null;
    fresh[n] = pick;
  }
  if (world.free < nodes.length) return null;
  for (const n of nodes) world.reserved[fresh[n]] = true;
  const steps = nodes.map((n) => ({
    node: n,
    site: fresh[n],
    kids: kidsOf(n) ? kidsOf(n).map((c) => (fresh[c] !== undefined ? fresh[c] : siteOfNode(world, base, c))) : null,
  }));
  return { base, leaves, steps, root: fresh[0] };
}

function cast(world, step) {
  world.plates[step.site] = { site: step.site, node: step.node, kids: step.kids, born: ++world.born };
  delete world.reserved[step.site];
  world.free -= 1;
}

// Compare-and-swap on the token: it only takes the new root if nobody published meanwhile.
function swap(world, expected, root) {
  if (world.token !== expected) return false;
  const before = reach(world, [expected]);
  let both = 0;
  for (const s of reach(world, [root])) if (before.has(s)) both++;
  world.token = root;
  world.version += 1;
  world.history.push({ version: world.version, root, shared: both / NODES });
  return true;
}

function reach(world, roots) {
  const seen = new Set();
  const stack = roots.filter((s) => s >= 0 && world.plates[s]);
  while (stack.length) {
    const s = stack.pop();
    if (seen.has(s) || !world.plates[s]) continue;
    seen.add(s);
    const kids = world.plates[s].kids;
    if (kids) stack.push(...kids);
  }
  return seen;
}

const platesOf = (world) => Object.keys(world.plates).map(Number);

// Plates no token, reader or writer reaches: what the next collection will free.
function pending(world, roots) {
  const live = reach(world, roots);
  return platesOf(world).filter((s) => !live.has(s));
}

// The starting state: version 1 cast whole, version 2 with one change, so the stone opens
// on a page that already shares 11 of its 15 plates.
function seedWorld(free) {
  const world = createWorld(free + NODES + LEVELS);
  const first = [];
  for (let n = NODES - 1; n >= 0; n--) first.push({ node: n, site: n * SITES, kids: kidsOf(n) ? kidsOf(n).map((c) => c * SITES) : null });
  for (const step of first) cast(world, step);
  world.token = 0;
  world.version = 1;
  world.history.push({ version: 1, root: 0, shared: 0 });
  const plan = compose(world, 0, [5]);
  for (const step of plan.steps) cast(world, step);
  swap(world, 0, plan.root);
  return world;
}

// Parts whose shape changes as they move: the reader heads (their arms reach diagonally from
// the rail to the plate they read) and the collector's hopper load. Shared by the build and the
// page, so the first frame and every later frame come from the same code.
function makeMovers(k, P, D) {
  const S = (paths, style) => k.solidSvg(paths, style);
  const R = D.reader;

  // One reader head: a carriage on the front rail, a post, an arm at its own height and a lens
  // over the plate it reads. `cx` is the carriage, `[lx, ly]` the lens, `lit` while reading.
  function reader(index, cx, lx, ly, lit) {
    const zArm = R.arm0 + R.armStep * index;
    const out = [];
    out.push(S(k.slabOf({ x: cx - 4.5, y: R.y0, w: 9, d: R.d, r: 1 }, R.z0, R.h, P, 3, 0.4), { tone: "mid" }));
    out.push(k.dotsSvg([k.iso([cx - 2.6, R.y0 + R.d - 1.4, R.z0 + R.h], P), k.iso([cx + 2.6, R.y0 + R.d - 1.4, R.z0 + R.h], P)], { size: 0.4, tone: "lo" }));
    const px = cx;
    const py = R.post;
    out.push(S(k.cylinder(px, py, 1.3, R.z0 + R.h, zArm - R.z0 - R.h, P, 16), { tone: "mid", crease: "none" }));
    out.push(S(k.cylinder(px, py, 2, zArm, 2.4, P, 20), { tone: "mid" }));
    const dx = lx - px;
    const dy = ly - py;
    const len = Math.hypot(dx, dy) || 1;
    const nx = (-dy / len) * 1.1;
    const ny = (dx / len) * 1.1;
    const ring = [[px + nx, py + ny], [lx + nx, ly + ny], [lx - nx, ly - ny], [px - nx, py - ny]];
    if (len > 2.5) out.push(S(k.extrude(ring, zArm + 0.4, 1.6, P), { tone: "mid", crease: "none" }));
    out.push(S(k.cylinder(lx, ly, 2.5, zArm - 3.4, 5.2, P, 24, 0.3), { tone: "hi", lit }));
    out.push(k.lineSvg(k.ring(lx, ly, 1.3, zArm + 1.8, P, 16), { tone: lit ? "lit" : "lo" }));
    return out.join("");
  }

  // The pile of swept plates inside the hopper, seen through its open top.
  function pile(count) {
    const H = D.hopper;
    const z = H.floor + Math.min(count, H.max) * H.step;
    const open = { x: H.x + 1.4, y: H.y + 1.4, w: H.w - 2.8, d: H.d - 2.8, r: 0.6 };
    const a = [open.x, open.y];
    const b = [open.x + open.w, open.y];
    const c = [open.x, open.y + open.d];
    const at = (x, y, zz) => k.iso([x, y, zz], P);
    const quad = (pts) => k.pathOf(pts, true);
    const back = quad([at(a[0], a[1], H.top), at(b[0], b[1], H.top), at(b[0], b[1], z), at(a[0], a[1], z)]);
    const left = quad([at(a[0], a[1], H.top), at(c[0], c[1], H.top), at(c[0], c[1], z), at(a[0], a[1], z)]);
    const floor = quad([at(open.x, open.y, z), at(open.x + open.w, open.y, z), at(open.x + open.w, open.y + open.d, z), at(open.x, open.y + open.d, z)]);
    return `<path class="iso-shade" data-shade="1" d="${back}"/><path class="iso-shade" data-shade="0" d="${left}"/><path class="${count ? "iso-top" : "mp-void"}" d="${floor}"/><path class="iso-line" data-tone="lo" d="${quad([at(open.x, open.y, H.top), at(open.x + open.w, open.y, H.top), at(open.x + open.w, open.y + open.d, H.top), at(open.x, open.y + open.d, H.top)])}"/>`;
  }

  return { reader, pile };
}

// ---------------------------------------------------------------- painting the model

    if (!p) continue;
    const fresh = born[s] !== undefined && clock - born[s] < 0.8;

  }
  fallingEl.innerHTML = out;
}
function drawLatch(calm) {
  const t = calm ? 1 : (clock - latch.t0) / 0.6;
  let dy = 0;
  if (t < 1) dy = latch.ok ? -2.2 * ease(t / 0.4) : -0.9 * Math.sin(Math.PI * Math.min(1, t / 0.35));
  else dy = latch.ok && clock - latch.t0 < 1.4 ? -2.2 * (1 - ease((clock - latch.t0 - 0.9) / 0.5)) : 0;
  latchEl.setAttribute("transform", translateAlong(P, [0, dy, 0]));
  latchEl.toggleAttribute("data-on", t < 1.6 && latch.ok);
  const c = calm ? 1 : (clock - card.t0) / 0.7;
  const lift = c < 1 ? 7 * Math.sin(Math.PI * c) : 0;
  cardEl.setAttribute("transform", lift ? translateAlong(P, [0, 0, lift]) : "");
}

// ---------------------------------------------------------------- tour, input, loop
const TOUR = ["write", 2, "collect", 2, "contend", 2.5, "collect", 2, "multi", 2, "readers+", 1.5, "write", 2, "collect", 2.5, "readers-", 1];
let touring = !still.matches;
let tourAt = 0;
let tourWait = 1.4;
let idleTimer = 0;
const idle = () => !W1.busy && !W2.busy && W1.queue.length === 0 && W2.queue.length === 0;
function act(name) {
  if (name === "write") { if (!W1.busy) writeJob(W1, [rnd(LEAVES)]); }
  else if (name === "multi") { if (!W1.busy) { const a = rnd(LEAVES); writeJob(W1, [a, (a + 3) % LEAVES, (a + 5) % LEAVES]); say("One version for three changes: setAttributes"); } }
  else if (name === "contend") {
    if (W1.busy || W2.busy) return;
    writeJob(W1, [4 + rnd(2), 6 + rnd(2)], { slow: 0.25 });
    W2.busy = true;
    W2.queue.push({ fn: () => (W1.base >= 0 && W1.x > holeX + 40 ? 0 : false) });
    writeJob(W2, [rnd(4)]);
  } else if (name === "collect") startCollect();
  else if (name === "readers+") readerCount = Math.min(4, readerCount + 1);
  else if (name === "readers-") readerCount = Math.max(1, readerCount - 1);
  dirty = true;
}
function runTour(dt) {
  if (!touring) return;
  if (tourWait > 0) { tourWait -= dt; return; }
  if (!idle() || gc.phase !== "idle") return;
  const item = TOUR[tourAt % TOUR.length];
  tourAt += 1;
  if (typeof item === "number") tourWait = item;
  else act(item);
}
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; tourWait = 0.5; run(); }, 9000);
}
stage.addEventListener("keydown", (event) => {
  const key = event.key;
  let name = null;
  if (key === "w" || key === "W" || key === "Enter" || key === " ") name = event.shiftKey ? "multi" : "write";
  else if (key === "c" || key === "C") name = "contend";
  else if (key === "g" || key === "G") name = "collect";
  else if (key === "+" || key === "=" || key === "ArrowUp" || key === "ArrowRight") name = "readers+";
  else if (key === "-" || key === "_" || key === "ArrowDown" || key === "ArrowLeft") name = "readers-";
  if (!name) return;
  event.preventDefault();
  takeOver();
  act(name);
  run();
});
svg.addEventListener("click", (event) => {
  takeOver();
  stage.focus({ preventScroll: true });
  if (event.target.closest('[data-part="readers"]')) act("readers+");
  else if (event.target.closest('[data-part="collector"]') || event.target.closest('[data-name^="bin"]') || event.target.closest('[data-name^="stock"]')) act("collect");
  else act("write");
  run();
});

let frame = 0;
let last = 0;
let visible = false;
function tick(now) {
  const real = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  clock += real;
  let dt = real;
  if (paused > 0) {
    paused -= real;
    dt = 0;
  }
  runTour(real);
  if (dt > 0) {
    for (const w of writers) runWriter(w, dt);
    moveWriters(dt, calm);
    runReaders(calm ? 0 : dt, calm);
  }
  runCollector(dt, calm);
  drawFalls(calm);
  drawLatch(calm);
  if (dirty || Object.keys(born).some((s) => clock - born[s] < 1)) {
    dirty = false;
    paint();
  }
  frame = visible ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);
runReaders(0, true);
paint();
</script></body></html>
